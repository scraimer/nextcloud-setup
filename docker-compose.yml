# docker-compose.yml – Nextcloud + Collabora Online (WYSIWYG editing)
#
# All persistent data lives under DATA_DIR (set in .env).
# Named volumes with driver_opts bind them to host paths so files are accessible
# directly on the host while Docker still tracks the volume lifecycle.
# Run ./install.sh to bootstrap; this file is managed by that script.

version: "3.8"

services:

  # ── MariaDB ────────────────────────────────────────────────────────────────
  db:
    image: ${MARIADB_IMAGE:-mariadb:10.11}
    restart: unless-stopped
    command: >
      --transaction-isolation=READ-COMMITTED
      --log-bin=binlog
      --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - nextcloud-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Nextcloud ──────────────────────────────────────────────────────────────
  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:30-apache}
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
    volumes:
      # Application files: config, installed apps, themes
      - nc-app:/var/www/html
      # User data: documents, photos – the primary backup target
      - nc-userdata:/var/www/html/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nextcloud-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Collabora Online (WYSIWYG document / spreadsheet / presentation editing) ──
  collabora:
    image: ${COLLABORA_IMAGE:-collabora/code:latest}
    restart: unless-stopped
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    environment:
      # Regex matching the Nextcloud URL – Collabora only accepts WOPI requests
      # from hosts that match this pattern (dots escaped for regex).
      aliasgroup1: ${NEXTCLOUD_WOPI_DOMAIN}
      # Disable internal TLS; terminate HTTPS at a reverse proxy when needed.
      extra_params: --o:ssl.enable=false --o:ssl.termination=false
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD}
    cap_add:
      - MKNOD
    networks:
      - nextcloud-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  nextcloud-net:
    driver: bridge

# Named volumes bound to host paths under DATA_DIR.
# The host directories must exist before `docker compose up` (install.sh creates them).
# Files appear as normal directories on the host at the device paths below.
volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/db
  nc-app:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/app
  nc-userdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/userdata
